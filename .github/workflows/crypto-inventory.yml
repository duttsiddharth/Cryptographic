name: Cryptographic inventory

on: [push, pull_request]

jobs:
  qsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Four exclusions, and the reason matters if you are adapting this
      # workflow for your own repository:
      #   samples/ holds deliberately broken cryptography for the worked example
      #   qsafe/   is the rule pack itself, which names every algorithm
      #   tests/   asserts against MD5 and SHA-1 on purpose
      #   sample-* are the published example outputs, which list what they found
      # Scanning any of them reports on the tool rather than on shipped code.
      # In your own repository you will want the equivalent for test fixtures
      # and vendored dependencies.
      - name: Scan for quantum-broken cryptography
        run: |
          python -m qsafe.cli . -o qsafe-output \
            --exclude samples \
            --exclude qsafe \
            --exclude tests \
            --exclude 'sample-*' \
            --fail-on immediate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbom
          path: qsafe-output/
